name: Skill problem
description: Report incorrect, unsafe, or unclear skill behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Affected skill
      options:
        - janef
        - engineering-standard
        - threat-model
        - auth-hardening
        - vuln-audit
        - variant-hunt
        - secrets-guard
        - security-logging
        - Packaging or installer
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the request, observed behavior, and expected defensive behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add relevant output with secrets and personal data removed.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, and private data from this report.
          required: true
