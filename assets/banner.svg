<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JANEF Forge — engineering discipline for AI coding agents">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0A0F1A"/>
      <stop offset="0.5" stop-color="#0D1626"/>
      <stop offset="1" stop-color="#0F1D33"/>
    </linearGradient>
    <linearGradient id="au" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D28A"/>
      <stop offset="0.5" stop-color="#D4AF61"/>
      <stop offset="1" stop-color="#B8923F"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A2E4A"/>
      <stop offset="1" stop-color="#0C1526"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#D4AF61" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#D4AF61" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#sky)"/>

  <g transform="translate(190,200)" fill="none" stroke="#20344F" stroke-width="1" opacity="0.55">
    <circle r="120"/>
    <circle r="160"/>
    <circle r="200"/>
    <circle r="240"/>
  </g>
  <g transform="translate(190,200)" fill="none" stroke="#26456B" stroke-width="1" opacity="0.35">
    <path d="M-240 0 H240 M0 -240 V240"/>
  </g>
  <circle cx="190" cy="200" r="230" fill="url(#glow)"/>

  <g transform="translate(190,200)" filter="url(#lift)">
    <path d="M0 -108 L86 -72 L86 26 C86 82 48 118 0 134 C-48 118 -86 82 -86 26 L-86 -72 Z"
          fill="url(#shieldGrad)" stroke="url(#au)" stroke-width="3"/>
    <path d="M0 -80 L62 -54 L62 20 C62 62 34 90 0 104 C-34 90 -62 62 -62 20 L-62 -54 Z"
          fill="none" stroke="#33517A" stroke-width="1.5" opacity="0.8"/>
    <path d="M0 -54 L40 -36 L40 14 C40 42 22 62 0 72 C-22 62 -40 42 -40 14 L-40 -36 Z"
          fill="none" stroke="#3B5C88" stroke-width="1.2" opacity="0.6"/>
    <path d="M-38 6 L-12 34 L44 -38" fill="none" stroke="url(#au)" stroke-width="11"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(340,150)">
    <text x="0" y="0" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
          font-size="88" font-weight="800" letter-spacing="-2.5" fill="#F6F8FB">JANEF <tspan fill="url(#au)">Forge</tspan></text>
    <rect x="3" y="20" width="620" height="2" fill="#24384F"/>
    <text x="3" y="50" font-family="'SFMono-Regular','Consolas','Menlo',monospace"
          font-size="19" letter-spacing="0.3" fill="#9DB0C8">engineering discipline for AI coding agents · forge better code, prove every change</text>
  </g>

  <g transform="translate(343,250)" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <g>
      <text x="0" y="0" font-size="15" font-weight="700" letter-spacing="1.5" fill="#D4AF61">ROUTE</text>
      <text x="0" y="22" font-size="14" fill="#7E92AB" font-family="'SFMono-Regular','Consolas',monospace">/forge · lean · standard · high-assurance</text>
    </g>
    <line x1="150" y1="-12" x2="150" y2="26" stroke="#24384F" stroke-width="1"/>
    <g transform="translate(178,0)">
      <text x="0" y="0" font-size="15" font-weight="700" letter-spacing="1.5" fill="#D4AF61">ENGINEER &amp; SECURE</text>
      <text x="0" y="22" font-size="14" fill="#7E92AB" font-family="'SFMono-Regular','Consolas',monospace">16 engineering · 8 security capabilities</text>
    </g>
    <line x1="470" y1="-12" x2="470" y2="26" stroke="#24384F" stroke-width="1"/>
    <g transform="translate(498,0)">
      <text x="0" y="0" font-size="15" font-weight="700" letter-spacing="1.5" fill="#D4AF61">PROVE</text>
      <text x="0" y="22" font-size="14" fill="#7E92AB" font-family="'SFMono-Regular','Consolas',monospace">risk-based verification · evidence gate</text>
    </g>
  </g>

  <text x="343" y="338" font-family="'SFMono-Regular','Consolas','Menlo',monospace"
        font-size="13" letter-spacing="1" fill="#61789A">one contract. minimum context. proof before done. defensive only.</text>

  <rect x="0" y="396" width="1280" height="4" fill="url(#au)"/>
</svg>
